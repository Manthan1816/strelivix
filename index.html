<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chronicle — Work Log & Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070c;
      --panel-bg: rgba(13, 17, 27, 0.72);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-hover: rgba(168, 85, 247, 0.4);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --accent-grad: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #06b6d4 100%);
      --emerald: #10b981;
      --text: #f9fafb;
      --text-dim: #94a3b8;
      --input-bg: rgba(8, 11, 18, 0.88);
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 20px 70px;
      position: relative;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(130px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      top: -120px;
      left: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
    }
    .glow-2 {
      bottom: -150px;
      right: 10%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 70%);
    }

    .app-shell {
      width: 100%;
      max-width: 1380px;
      position: relative;
      z-index: 1;
    }

    /* Auth Overlay */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 7, 12, 0.88);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .auth-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .auth-sub {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .auth-switch {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 14px;
      cursor: pointer;
    }
    .auth-switch span { color: var(--accent); font-weight: 600; }

    /* Top Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--panel-border);
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .brand-tagline {
      font-size: 0.88rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .user-profile-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-email-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-dim);
      background: var(--input-bg);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }
    .btn-logout {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.25);
      color: var(--danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 25px;
      align-items: stretch;
    }

    @media (max-width: 950px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      transition: border-color 0.25s ease;
    }

    .glass-panel:hover {
      border-color: var(--panel-border-hover);
    }

    .panel-action-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--panel-border);
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 12px var(--emerald);
    }

    .btn-save {
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
    }
    .btn-save:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .form-group { margin-bottom: 14px; text-align: left; }

    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Calendar */
    .calendar-container {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cal-month-title {
      font-weight: 600;
      font-size: 0.92rem;
      color: #fff;
    }

    .cal-nav-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .cal-nav-btn:hover { color: #fff; border-color: var(--accent); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 600;
      padding-bottom: 6px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.15s ease;
      position: relative;
    }

    .cal-day:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .cal-day.active {
      background: var(--accent-grad);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .cal-day.has-entry::after {
      content: "";
      position: absolute;
      bottom: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--emerald);
    }

    /* Attachments Dropzone */
    .file-dropzone {
      border: 1.5px dashed var(--panel-border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.01);
    }
    .file-dropzone:hover {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.03);
    }
    .file-dropzone span { font-size: 0.82rem; color: var(--text-dim); }
    .file-dropzone .sub-text { font-size: 0.7rem; color: #64748b; }
    .file-dropzone input { display: none; }

    .file-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .file-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-chip a {
      color: var(--accent);
      text-decoration: none;
    }
    .file-chip .remove-btn {
      color: var(--danger);
      cursor: pointer;
      font-weight: 700;
    }

    /* Notes Canvas */
    .editor-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }

    .large-notes-editor {
      flex: 1;
      width: 100%;
      min-height: 520px;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      color: var(--text);
      padding: 22px;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
      outline: none;
      resize: none;
      transition: all 0.2s ease;
    }

    .large-notes-editor:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Saved Entries */
    .left-logs-drawer {
      margin-top: 14px;
      border-top: 1px solid var(--panel-border);
      padding-top: 12px;
      max-height: 170px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--panel-border) transparent;
    }

    .log-item {
      background: rgba(8, 11, 18, 0.75);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
    }

    .btn-delete-pill {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.25);
      color: var(--danger);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.68rem;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 15px 10px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
  </style>

  <!-- Firebase Script Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // Your Config Keys:
    const firebaseConfig = {
      apiKey: "AIzaSyDh5zRZ84V97d7rYEZXaOes8HCTPjwZN4w",
      authDomain: "daily-diary-7c406.firebaseapp.com",
      databaseURL: "https://daily-diary-7c406-default-rtdb.firebaseio.com",
      projectId: "daily-diary-7c406",
      storageBucket: "daily-diary-7c406.firebasestorage.app",
      messagingSenderId: "848479439804",
      appId: "1:848479439804:web:340af43a2080210ca079b9",
      measurementId: "G-RBERNEFGP7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isRegisterMode = false;
    let selectedDateStr = new Date().toISOString().split("T")[0];
    let currentDate = new Date();
    let pendingFiles = [];

    // --- Authentication ---
    const authOverlay = document.getElementById("authOverlay");
    const authBtn = document.getElementById("authSubmitBtn");
    const authEmail = document.getElementById("authEmail");
    const authPass = document.getElementById("authPassword");
    const authSwitch = document.getElementById("authSwitchBtn");
    const authTitle = document.getElementById("authCardTitle");
    const userEmailDisplay = document.getElementById("userEmailDisplay");

    authSwitch.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      authTitle.textContent = isRegisterMode ? "Create Account" : "Welcome Back";
      authBtn.textContent = isRegisterMode ? "Sign Up" : "Log In";
      authSwitch.innerHTML = isRegisterMode ? "Have an account? <span>Log In</span>" : "Don't have an account? <span>Sign Up</span>";
    });

    authBtn.addEventListener("click", async () => {
      const email = authEmail.value.trim();
      const pass = authPass.value.trim();
      if (!email || !pass) return alert("Please fill in email and password.");

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authOverlay.style.display = "none";
        userEmailDisplay.textContent = user.email;
        attachRealtimeListeners();
      } else {
        authOverlay.style.display = "flex";
      }
    });

    // --- Real-time Sync with Firestore ---
    let unsubscribeSnap = null;
    function attachRealtimeListeners() {
      if (!currentUser) return;
      renderCalendar();

      if (unsubscribeSnap) unsubscribeSnap();

      const userEntriesRef = collection(db, "users", currentUser.uid, "entries");
      unsubscribeSnap = onSnapshot(userEntriesRef, (snapshot) => {
        const allEntries = [];
        snapshot.forEach(d => allEntries.push({ id: d.id, ...d.data() }));

        markCalendarEntries(allEntries);
        renderCurrentDayLogs(allEntries);
      });
    }

    function renderCurrentDayLogs(allEntries) {
      const logsContainer = document.getElementById("logsContainer");
      const currentDayEntries = allEntries.filter(e => e.date === selectedDateStr);
      logsContainer.innerHTML = "";

      if (currentDayEntries.length === 0) {
        logsContainer.innerHTML = `<div class="empty-state">No entries for this date.</div>`;
        return;
      }

      currentDayEntries.forEach(item => {
        const div = document.createElement("div");
        div.className = "log-item";

        let attachmentsHtml = "";
        if (item.files && item.files.length > 0) {
          attachmentsHtml = `<div class="file-preview-list" style="margin-top: 4px;">` +
            item.files.map(f => `
              <div class="file-chip">
                <a href="${f.data}" download="${f.name}">📎 ${f.name}</a>
              </div>
            `).join("") + `</div>`;
        }

        div.innerHTML = `
          <div class="log-header">
            <div class="log-title">${item.title}</div>
            <button class="btn-delete-pill" onclick="window.deleteEntry('${item.id}')">✕</button>
          </div>
          ${attachmentsHtml}
        `;
        logsContainer.appendChild(div);
      });
    }

    window.deleteEntry = async (docId) => {
      if (!currentUser) return;
      await deleteDoc(doc(db, "users", currentUser.uid, "entries", docId));
    };

    // --- Save Entry to Firestore ---
    document.getElementById("saveBtn").addEventListener("click", async () => {
      if (!currentUser) return alert("Please log in first.");

      const title = document.getElementById("taskName").value.trim();
      const notes = document.getElementById("taskNotes").value.trim();
      if (!title) return alert("Please enter a title.");

      const saveBtn = document.getElementById("saveBtn");
      saveBtn.textContent = "Saving...";
      saveBtn.disabled = true;

      try {
        await addDoc(collection(db, "users", currentUser.uid, "entries"), {
          date: selectedDateStr,
          title,
          notes,
          files: pendingFiles,
          timestamp: Date.now()
        });

        document.getElementById("taskName").value = "";
        document.getElementById("taskNotes").value = "";
        pendingFiles = [];
        renderFilePreviews();
      } catch (err) {
        alert("Error saving: " + err.message);
      } finally {
        saveBtn.textContent = "✓ Save Entry";
        saveBtn.disabled = false;
      }
    });

    // --- File Handling ---
    const fileInput = document.getElementById("fileInput");
    const previewContainer = document.getElementById("previewContainer");

    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (file.size > 800 * 1024) {
          alert(`"${file.name}" is over 800KB. Keep files small so they stay free.`);
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          pendingFiles.push({
            name: file.name,
            data: event.target.result
          });
          renderFilePreviews();
        };
        reader.readAsDataURL(file);
      });
    });

    function renderFilePreviews() {
      previewContainer.innerHTML = "";
      pendingFiles.forEach((file, idx) => {
        const span = document.createElement("div");
        span.className = "file-chip";
        span.innerHTML = `<span>📎 ${file.name}</span><span class="remove-btn" onclick="removePendingFile(${idx})">✕</span>`;
        previewContainer.appendChild(span);
      });
    }

    window.removePendingFile = (idx) => {
      pendingFiles.splice(idx, 1);
      renderFilePreviews();
    };

    // --- Calendar Logic ---
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById("monthYearLabel").textContent = `${monthNames[month]} ${year}`;

      const grid = document.getElementById("calendarDays");
      grid.innerHTML = "";

      ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].forEach(d => {
        const span = document.createElement("div");
        span.className = "cal-day-label";
        span.textContent = d;
        grid.appendChild(span);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement("div");
        cell.className = "cal-day";
        cell.textContent = day;

        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if (dateKey === selectedDateStr) cell.classList.add("active");

        cell.addEventListener("click", () => {
          selectedDateStr = dateKey;
          document.getElementById("viewHeading").textContent = `Summary & Notes (${selectedDateStr})`;
          renderCalendar();
          if (currentUser) attachRealtimeListeners();
        });

        grid.appendChild(cell);
      }
    }

    function markCalendarEntries(entries) {
      const datesSet = new Set(entries.map(e => e.date));
      const cells = document.querySelectorAll(".cal-day");
      cells.forEach(cell => {
        const day = cell.textContent;
        if (!day) return;
        const key = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if (datesSet.has(key)) cell.classList.add("has-entry");
      });
    }

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
      if (currentUser) attachRealtimeListeners();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
      if (currentUser) attachRealtimeListeners();
    });

    renderCalendar();
  </script>
</body>
</html>
